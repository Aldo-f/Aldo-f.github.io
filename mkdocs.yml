site_name: Aldo Fieuw Documentation
site_url: https://aldo-f.github.io
repo_url: https://github.com/Aldo-f/Aldo-f.github.io
repo_name: Aldo-f/Aldo-f.github.io
theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
    - scheme: slate
      primary: indigo
      accent: indigo
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.highlight
    - search.share
    - navigation.indexes
    - toc.integrate
    - navigation.top
    - navigation.sections
    - toc.follow
    - toc.integrate
plugins:
  - search
  - multirepo:
      nav_repos:
        - name: thuis
          import_url: https://github.com/Aldo-f/thuis?branch=main&docs_dir=docs
        - name: thuis-v3
          import_url: https://github.com/Aldo-f/thuis?branch=v3.0.0&docs_dir=docs
nav:
  - Home: docs/index.md
  - Thuis:
      - 'Thuis (latest)': '!import https://github.com/Aldo-f/thuis?branch=main&docs_dir=docs'
      - 'Thuis v3.0.0': '!import https://github.com/Aldo-f/thuis?branch=v3.0.0&docs_dir=docs'
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Aldo-f
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/aldo-fieuw
    - icon: fontawesome/brands/mastodon
      link: https://mastodon.social/@aldo_fieuw
markdown_extensions:
  - toc:
      permalink: true

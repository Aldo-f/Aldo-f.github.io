INHERIT: mkdocs.base.yml
site_url: https://aldo-f.github.io/nl/
docs_dir: docs/nl
site_dir: site/nl
theme:
  language: nl
extra:
  alternate:
    - name: English
      link: /../
      lang: en
    - name: Nederlands
      link: /
      lang: nl
  extra_css:
    - https://unpkg.com/pagefind@latest/pagefind-ui.css
  extra_javascript:
    - https://unpkg.com/pagefind@latest/pagefind-ui.js
    - /js/pagefind-init.js
plugins:
  - search:
      lang: nl
  - autotranslate:
      languages: [en, nl]
      paths: [blog/posts, about.md, projects.md, index.md]
      exclude: [blog/category/*]
      mode: report
  - blog:
      blog_dir: blog
      post_date_format: yyyy-MM-dd
      archive: false
  - section-index
  - multirepo:
      nav_repos:
        - name: thuis
          import_url: https://github.com/Aldo-f/thuis?branch=main
          imports:
            - docs
        - name: thuis-v3
          import_url: https://github.com/Aldo-f/thuis?branch=v3.0.0
          imports:
            - docs
        - name: thuis-v4
          import_url: https://github.com/Aldo-f/thuis?branch=v4.1.0&docs_dir=website/docs/*
          imports:
            - docs
        - name: thuis-v5
          import_url: https://github.com/Aldo-f/thuis?branch=v5/main&docs_dir=website/docs/*
          imports:
            - docs
        - name: clock
          import_url: https://github.com/Aldo-f/clock?branch=main
          imports:
            - docs
        - name: blanky
          import_url: https://gitlab.com/Aldo-f/blanky?branch=main
          imports:
            - docs
        - name: blanky-v1
          import_url: https://gitlab.com/Aldo-f/blanky?branch=v1-docs
          imports:
            - docs
nav:
  - Home: index.md
  - Over: about.md
  - Blog: blog/index.md
  - Home-lab Docs: home-lab-docs.md
INHERIT: mkdocs.base.yml
site_url: https://aldo-f.github.io/nl/
docs_dir: docs/nl
site_dir: site/nl
theme:
  language: nl
extra:
  alternate:
    - name: English
      link: /../
      lang: en
    - name: Nederlands
      link: /
      lang: nl
  extra_css:
    - https://unpkg.com/pagefind@latest/pagefind-ui.css
  extra_javascript:
    - https://unpkg.com/pagefind@latest/pagefind-ui.js
    - /js/pagefind-init.js
plugins:
  - blog:
      blog_dir: blog
      post_date_format: yyyy-MM-dd
      archive: false
  - section-index
nav:
  - Home: index.md
  - Over: about.md
  - Blog: blog/index.md
  - Home-lab Docs: home-lab-docs.md
INHERIT: mkdocs.base.yml
site_url: https://aldo-f.github.io/nl/
docs_dir: docs/nl
site_dir: site/nl
theme:
  language: nl
extra:
  alternate:
    - name: English
      link: /../
      lang: en
    - name: Nederlands
      link: /
      lang: nl
plugins:
  - blog:
      blog_dir: blog
      post_date_format: yyyy-MM-dd
      archive: false
  - search
nav:
  - Home: index.md
  - Over: about.md
  - Blog: blog/index.md

INHERIT: mkdocs.base.yml
site_url: https://aldo-f.github.io
docs_dir: docs/en
site_dir: site
extra:
  alternate:
    - name: English
      link: /
      lang: en
    - name: Nederlands
      link: /nl/
      lang: nl
  extra_css:
    - assets/css/giscus-no-branding.css
  extra_javascript: []
plugins:
  - search
  - blog:
      blog_dir: blog
      post_date_format: yyyy-MM-dd
      archive: true
      archive_url_date_format: yyyy/MM
  - section-index
  - multirepo:
      nav_repos:
        - name: thuis
          import_url: https://github.com/Aldo-f/thuis?branch=main
          imports:
            - docs
        - name: thuis-v3
          import_url: https://github.com/Aldo-f/thuis?branch=v3.0.0
          imports:
            - docs
        - name: thuis-v4
          import_url: https://github.com/Aldo-f/thuis?branch=v4.1.0&docs_dir=website/docs/*
          imports:
            - docs
        - name: thuis-v5
          import_url: https://github.com/Aldo-f/thuis?branch=v5/main&docs_dir=website/docs/*
          imports:
            - docs
        - name: clock
          import_url: https://github.com/Aldo-f/clock?branch=main
          imports:
            - docs
        - name: blanky
          import_url: https://gitlab.com/Aldo-f/blanky?branch=main
          imports:
            - docs
        - name: opencode-multi-model-fallback
          import_url: https://github.com/Aldo-f/opencode-multi-model-fallback?branch=main
          imports:
            - docs
        - name: blanky-v1
          import_url: https://gitlab.com/Aldo-f/blanky?branch=v1-docs
          imports:
            - docs
nav:
  - About: about.md
  - Blog: blog/index.md
  - Projects:
      - projects.md
      - Radio Community:
          - Overview: radio-community/index.md
          - Getting started: radio-community/getting-started.md
          - Project: radio-community/project.md
      - Clock:
          - clock/docs/index.md
          - Features: clock/docs/features.md
          - Development: clock/docs/development.md
      - Blanky:
          - 'Blanky main': blanky/docs/index.md
          - 'Blanky v1': blanky-v1/docs/index.md
      - Thuis:
          - 'Thuis main':
              - Overview: thuis/docs/index.md
              - Installation: thuis/docs/installation.md
              - Usage: thuis/docs/usage.md
              - Testing: thuis/docs/testing.md
              - DRM: thuis/docs/drm.md
              - Troubleshooting: thuis/docs/troubleshooting.md
              - Nederlands:
                  - Overzicht: thuis/docs/nl/index.md
                  - Installatie: thuis/docs/nl/installation.md
                  - Gebruik: thuis/docs/nl/usage.md
                  - Testen: thuis/docs/nl/testing.md
                  - DRM: thuis/docs/nl/drm.md
                  - Probleemoplossing: thuis/docs/nl/troubleshooting.md
          - 'Thuis v5':
              - Overview: thuis-v5/website/docs/intro.md
              - Getting started: thuis-v5/website/docs/getting-started.md
              - Usage: thuis-v5/website/docs/usage.md
              - Architecture: thuis-v5/website/docs/architecture.md
              - API reference: thuis-v5/website/docs/api-reference.md
              - Credential vault: thuis-v5/website/docs/credential-vault.md
              - Provider adapter: thuis-v5/website/docs/provider-adapter.md
              - Search service: thuis-v5/website/docs/search-service.md
          - 'Thuis v4':
              - Overview: thuis-v4/website/docs/intro.md
              - Installation: thuis-v4/website/docs/installation.md
              - Usage: thuis-v4/website/docs/usage.md
              - Credentials: thuis-v4/website/docs/credentials.md
              - Development: thuis-v4/website/docs/development.md
          - 'Thuis v3':
              - Overview: thuis-v3/docs/index.md
              - Installation: thuis-v3/docs/installation.md
              - Usage: thuis-v3/docs/usage.md
              - Testing: thuis-v3/docs/testing.md
              - DRM: thuis-v3/docs/drm.md
              - Troubleshooting: thuis-v3/docs/troubleshooting.md
              - Nederlands:
                  - Overzicht: thuis-v3/docs/nl/index.md
                  - Installatie: thuis-v3/docs/nl/installation.md
                  - Gebruik: thuis-v3/docs/nl/usage.md
                  - Testen: thuis-v3/docs/nl/testing.md
                  - DRM: thuis-v3/docs/nl/drm.md
                  - Probleemoplossing: thuis-v3/docs/nl/troubleshooting.md
      - Home-lab Docs: home-lab-docs.md
      - OpenCode Fallback Plugin:
          - Overview: https://github.com/Aldo-f/opencode-multi-model-fallback
          - README: opencode-multi-model-fallback/docs/index.md

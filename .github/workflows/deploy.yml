name: Deploy MkDocs site to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Needed for git history if needed by plugins

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EN site (serves at root)
        run: mkdocs build --strict -f mkdocs.en.yml -d site

      - name: Build NL site (serves at /nl/)
        run: mkdocs build --strict -f mkdocs.nl.yml -d site/nl

      - name: Run Pagefind search index
        run: |
          pagefind --site site --verbose
          mkdir -p site/js
          cat > site/js/pagefind-init.js << 'EOF'
          document.addEventListener('DOMContentLoaded', () => {
            const searchEl = document.querySelector('[data-md-component="search"]');
            if (!searchEl) return;
            const query = searchEl.querySelector('[name="q"]');
            if (!query) return;
            query.addEventListener('keydown', async (e) => {
              if (e.key !== 'Enter' || e.target.value.trim() === '') return;
              e.preventDefault();
              const results = await window.$pagefind.default(e.target.value.trim(), {
                selector: 'article, h1, h2, h3, p, a',
                exclude: ['[data-pagefind-ignore]']
              });
              // Display results
              const resultsEl = document.createElement('div');
              resultsEl.className = 'pagefind-results';
              resultsEl.innerHTML = results.data.map(r =>
                `<a href="${r.meta.location}"><h4>${r.data.title}</h4><p>${r.data.excerpt}</p></a>`
              ).join('');
              searchEl.appendChild(resultsEl);
            });
          });
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
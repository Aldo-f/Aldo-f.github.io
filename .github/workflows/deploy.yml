name: Deploy MkDocs site to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for git history if needed by plugins

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm install -g pagefind

      - name: Build EN site (serves at root)
        run: mkdocs build --strict -f mkdocs.en.yml -d site

      - name: Build NL site (serves at /nl/)
        run: mkdocs build --strict -f mkdocs.nl.yml -d site/nl

      - name: Run Pagefind on EN site
        run: pagefind --site site

      - name: Run Pagefind on NL site
        run: pagefind --site site/nl

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
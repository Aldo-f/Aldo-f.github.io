{% extends "base.html" %}

{% block extrahead %}
{{ super() }}
{% endblock %}

{% block content %}
<div class="dungeon-container" id="dungeon-scene">
  <div class="dungeon-card" id="dungeon-card" aria-label="404 Dungeon scene">
    <div class="dungeon-header">
      <div class="dungeon-title" id="dungeon-title-text">⚔ The 404 Dungeon</div>
      <div class="dungeon-stats">
        <div class="stat-group">
          <span>♥</span>
          <div class="hearts" id="dungeon-hearts">
            <span class="heart">♥</span>
            <span class="heart">♥</span>
            <span class="heart">♥</span>
          </div>
          <span id="dungeon-hp" style="display:none">3</span>
        </div>
        <div class="stat-group">
          <span>🧠</span>
          <div class="confusion-meter">
            <span id="dungeon-conf">0</span>/3
            <div class="confusion-bar">
              <div class="confusion-fill" id="dungeon-conf-fill" style="width: 0%"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="dungeon-narrative" id="dungeon-text">
      Loading dungeon data...
    </div>

    <div class="choices" id="dungeon-choices"></div>

    <div class="dungeon-log" id="dungeon-log">[Awaiting your decision...]</div>

    <div class="escape-section">
      <button class="escape-btn hidden" id="escape-btn" aria-label="Back to Homepage">Terug naar start</button>
        <span>🚪</span> Back to Homepage
      </button>
    </div>
  </div>
</div>

<style>
.dungeon-container {
  max-width: 560px;
  margin: 2rem auto;
  padding: 1rem;
}

.dungeon-card {
  background: var(--md-sys-color-surface);
  color: var(--md-sys-on-surface);
  border: 1px solid var(--md-sys-color-outline-variant, rgba(255,255,255,0.12));
  border-radius: 16px;
  padding: 1.5rem;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  transition: opacity 250ms cubic-bezier(0.4, 0, 0.2, 1), transform 250ms cubic-bezier(0.4, 0, 0.2, 1);
}

.dungeon-card.fade-out {
  opacity: 0;
  transform: translateY(-8px);
}

.dungeon-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid var(--md-sys-color-outline-variant, rgba(255,255,255,0.12));
}

.dungeon-title {
  font-size: 1.25rem;
  font-weight: 700;
  letter-spacing: 0.5px;
}

.dungeon-stats {
  display: flex;
  gap: 0.75rem;
  align-items: center;
}

.stat-group {
  display: flex;
  align-items: center;
  gap: 0.35rem;
  font-size: 0.875rem;
}

.hearts {
  display: flex;
  gap: 0.15rem;
}

.heart {
  color: #e74c3c;
  font-size: 1.1rem;
  transition: transform 200ms, opacity 200ms;
}

.heart.lost {
  opacity: 0.2;
  transform: scale(0.8);
}

.confusion-meter {
  display: flex;
  align-items: center;
  gap: 0.35rem;
  color: #9b59b6;
}

.confusion-bar {
  width: 60px;
  height: 6px;
  background: rgba(255,255,255,0.1);
  border-radius: 3px;
  overflow: hidden;
}

.confusion-fill {
  height: 100%;
  background: linear-gradient(90deg, #2ecc71, #9b59b6);
  border-radius: 3px;
  transition: width 300ms cubic-bezier(0.4, 0, 0.2, 1);
}

.dungeon-narrative {
  font-size: 1rem;
  line-height: 1.6;
  color: var(--md-sys-on-surface);
  margin-bottom: 1.5rem;
  min-height: 4.5rem;
  padding: 1rem;
  background: rgba(0,0,0,0.15);
  border-radius: 12px;
  border-left: 3px solid #ff6b35;
}

.choices {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  margin-bottom: 1.5rem;
}

.choice-btn {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  width: 100%;
  padding: 1rem 1.25rem;
  background: rgba(0,0,0,0.2);
  border: 1px solid var(--md-sys-color-outline-variant, rgba(255,255,255,0.12));
  border-radius: 12px;
  color: var(--md-sys-on-surface);
  font-size: 0.95rem;
  font-family: inherit;
  cursor: pointer;
  transition: all 200ms cubic-bezier(0.4, 0, 0.2, 1);
  text-align: left;
}

.choice-btn:hover {
  background: #ff6b35;
  border-color: #ff6b35;
  transform: translateX(4px);
  box-shadow: 0 4px 16px rgba(255,107,53,0.3);
  color: #000;
}

.choice-btn:active {
  transform: translateX(2px) scale(0.99);
}

.choice-icon {
  font-size: 1.2rem;
  flex-shrink: 0;
  width: 28px;
  text-align: center;
}

.choice-label {
  flex: 1;
}

.dungeon-log {
  font-family: 'SF Mono', 'Fira Code', monospace;
  font-size: 0.8rem;
  color: var(--md-sys-on-surface-variant, rgba(255,255,255,0.6));
  padding: 0.75rem 1rem;
  background: rgba(0,0,0,0.2);
  border-radius: 8px;
  min-height: 2.5rem;
  margin-bottom: 1rem;
  border: 1px solid var(--md-sys-color-outline-variant, rgba(255,255,255,0.12));
}

.escape-section {
  text-align: center;
}

.escape-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.85rem 2rem;
  background: #2ecc71;
  border: none;
  border-radius: 12px;
  color: #000;
  font-size: 1rem;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: all 200ms cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 4px 16px rgba(46,204,113,0.3);
}

.escape-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 24px rgba(46,204,113,0.4);
}

.escape-btn:active {
  transform: translateY(0);
}

.escape-btn.hidden {
  display: none;
}

@media (prefers-reduced-motion: reduce) {
  .dungeon-card, .choice-btn, .escape-btn, .confusion-fill, .heart {
    transition: none !important;
  }
  .choice-btn:hover {
    transform: none;
  }
}

@media (max-width: 480px) {
  .dungeon-card { padding: 1rem; }
  .dungeon-header {
    flex-direction: column;
    gap: 0.75rem;
    align-items: flex-start;
  }
  .dungeon-stats {
    width: 100%;
    justify-content: space-between;
  }
  .choice-btn { padding: 0.85rem 1rem; }
}
</style>

<script type="module">
const MAX_CONF = 3;
const LANG = '{{ page.lang }}'.toLowerCase() || 'nl';
const BASE = LANG === 'nl' ? '/nl' : '';
const DATA_URL = `${BASE}/assets/data/404_dungeon.json`;

console.log(`[404 Dungeon] loading data from ${DATA_URL}`);

let state = { node: 'start', confusion: 0 };
let scenes = {};

async function init() {
  try {
    const response = await fetch(DATA_URL);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    scenes = data.nodes;
    console.log(`[404 Dungeon] loaded ${Object.keys(scenes).length} scenes`);
    render();
  } catch (err) {
    console.error(`[404 Dungeon] failed to load data: ${err.message}`);
    document.getElementById('dungeon-text').textContent =
      `Error loading dungeon data: ${err.message}. Please try again later.`;
  }
}

function t(node, field) {
  const v = scenes[node]?.[field];
  if (typeof v === 'object') return v[LANG] || v['en'] || '';
  return v || '';
}

function log(msg) {
  console.log(`[404 Dungeon] ${msg}`);
  const el = document.getElementById('dungeon-log');
  if (el) el.textContent = msg;
}

function fadeOutThen(fn) {
  const card = document.getElementById('dungeon-card');
  card.classList.add('fade-out');
  setTimeout(() => {
    card.classList.remove('fade-out');
    fn();
  }, 250);
}

function render() {
  const s = scenes[state.node];
  if (!s) return;

  fadeOutThen(() => {
    document.getElementById('dungeon-text').textContent = t(state.node, 'text');

    const hp = Math.max(0, MAX_CONF - state.confusion);
    document.getElementById('dungeon-hp').textContent = hp;
    document.querySelectorAll('#dungeon-hearts .heart').forEach((heart, i) => {
      heart.classList.toggle('lost', i >= hp);
    });

    const conf = Math.min(MAX_CONF, state.confusion);
    document.getElementById('dungeon-conf').textContent = conf;
    document.getElementById('dungeon-conf-fill').style.width = `${(conf / MAX_CONF) * 100}%`;

    document.getElementById('escape-btn').classList.toggle('hidden', (s.choices?.length || 0) !== 0);
    log(`[${state.node}] confusion=${state.confusion}`);

    const grid = document.getElementById('dungeon-choices');
    grid.innerHTML = '';

    const icons = ['🔍', '🌑', '⚔️', '🚪', '💡', '🗺️'];
    (s.choices || []).forEach((c, i) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'choice-btn';
      btn.innerHTML = `<span class="choice-icon">${icons[i % icons.length]}</span><span class="choice-label">${t(c, 'label')}</span>`;
      btn.addEventListener('click', () => {
        console.log(`[404 Dungeon] choice: ${t(c, 'label')} -> ${c.next || 'escape'}`);
        state.node = c.next || 'escape';
        const dest = scenes[state.node];
        if (dest && dest.statDelta !== undefined) {
          state.confusion = Math.max(0, Math.min(MAX_CONF, state.confusion + dest.statDelta));
        }
        log(`chose "${t(c, 'label')}" -> ${state.node} (confusion=${state.confusion})`);
        render();
      });
      grid.appendChild(btn);
    });

    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
    }
  });
}

document.getElementById('escape-btn').addEventListener('click', () => {
  console.log('[404 Dungeon] escaping to homepage');
  window.location.href = BASE || '/';
});

init();
</script>
{% endblock %}

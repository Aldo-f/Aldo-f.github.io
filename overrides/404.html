{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
{% endblock %}

{% block content %}
<div class="md-block" style="max-width: 100%; padding: 1rem;">
  <div id="dungeon-scene"
       class="md-card"
       style="elevation: 1; margin: 2rem auto; max-width: 640px; background: var(--md-sys-color-surface); color: var(--md-sys-on-surface); transition: opacity 200ms cubic-bezier(0.4, 0, 0.2, 1), transform 200ms cubic-bezier(0.4, 0, 0.2, 1); position: relative;"
       aria-label="404 Dungeon scene">
    <div id="dungeon-card" class="md-card" style="elevation: 1; transition: elevation 150ms ease; position: relative;" aria-labelledby="dungeon-title">
      <h2 id="dungeon-title" class="md-typography--headline6" style="font-size: var(--md-sys-typescale-body-medium); font-weight: 500; margin: 0;">
        <span id="dungeon-title-text">The 404 Dungeon</span>
        <span class="md-chip" style="margin-left: 0.5rem; background: var(--md-sys-color-primary); color: var(--md-sys-on-primary); font-size: 0.75rem;">HP: <span id="dungeon-hp">3</span>/3</span>
      </h2>
      <p id="dungeon-text" class="md-typography--subtitle1" style="margin: 0.5rem 0 1rem;"></p>
    </div>
    <div id="dungeon-stat" class="md-chip-group" style="position: absolute; bottom: 0.5rem; left: 0.5rem; right: 0.5rem;">
      <span class="md-chip" style="background: var(--md-sys-color-surface-variant); margin: 0.1rem;">Conf: <span id="dungeon-conf">0</span>/3</span>
    </div>
  </div>
  <div id="dungeon-log" class="md-chip-group" style="justify-content: center; margin-top: 0.5rem; min-height: 1.5rem;"></div>
  <div class="md-grid md-grid--spacing-x-2 md-grid--padding-y-4" style="justify-content: center;"></div>
  <button id="escape-btn" class="md-button" style="display: none; margin-top: 1rem; min-width: 180px;">Back to Homepage</button>
</div>

<script type="module">
// ---- 404 Dungeon state machine (DRY: shared data, loaded from JSON) ----
const MAX_CONF = 3;
const BASE = window.location.pathname.includes('/nl/') ? '/nl' : '';
const DATA_URL = `${BASE}/assets/data/404_dungeon.json`;
console.log(`[404 Dungeon] loading data from ${DATA_URL}`);

const response = await fetch(DATA_URL);
if (!response.ok) {
  console.error(`[404 Dungeon] failed to load data: ${response.status} ${response.statusText}`);
  document.getElementById('dungeon-text').textContent = `Error loading dungeon data (${response.status}).`;
} else {
  const data = await response.json();
  const scenes = data.nodes;
  console.log(`[404 Dungeon] loaded ${Object.keys(scenes).length} scenes`);

  const LANG = window.location.pathname.includes('/nl/') ? 'nl' : 'en';
  let state = { node: 'start', confusion: 0 };

  function t(node, field) {
    const v = scenes[node]?.[field];
    if (typeof v === 'object') return v[LANG] || v['en'] || '';
    return v || '';
  }

  function log(msg) {
    console.log(`[404 Dungeon] ${msg}`);
    const el = document.getElementById('dungeon-log');
    if (el) el.textContent = msg;
  }

  function render() {
    const s = scenes[state.node];
    if (!s) return;
    const title = state.node === 'start' ? 'The 404 Dungeon' : t(state.node, 'label') || state.node;
    document.getElementById('dungeon-title-text').textContent = title;
    document.getElementById('dungeon-text').textContent = t(state.node, 'text');
    document.getElementById('dungeon-hp').textContent = Math.max(0, MAX_CONF - state.confusion);
    document.getElementById('dungeon-conf').textContent = Math.min(MAX_CONF, state.confusion);
    document.getElementById('escape-btn').style.display = (s.choices?.length || 0) === 0 ? 'block' : 'none';
    log(`[${state.node}] confusion=${state.confusion}`);

    const grid = document.querySelector('.md-grid--spacing-x-2');
    if (!grid) return;
    grid.querySelectorAll('.choice-btn').forEach(b => b.remove());

    (s.choices || []).forEach(c => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'md-button md-button--outlined choice-btn';
      btn.style.minWidth = '160px';
      btn.textContent = t(c, 'label');
      btn.addEventListener('click', () => {
        console.log(`[404 Dungeon] choice: ${t(c, 'label')} -> ${c.next || 'escape'}`);
        state.node = c.next || 'escape';
        // Apply statDelta from the destination node
        const dest = scenes[state.node];
        if (dest && dest.statDelta !== undefined) {
          state.confusion = Math.max(0, Math.min(MAX_CONF, state.confusion + dest.statDelta));
        }
        log(`chose "${t(c, 'label')}" -> ${state.node} (confusion=${state.confusion})`);
        render();
      });
      grid.appendChild(btn);
    });

    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
    }
  }

  document.getElementById('escape-btn').addEventListener('click', () => {
    console.log('[404 Dungeon] escaping to homepage');
    window.location.href = BASE || '/';
  });

  render();
}
</script>
<style>
.md-card:hover, .md-card:focus-within { elevation: 2 !important; }
.md-card:active { elevation: 4 !important; }
.md-chip-group { display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
.md-grid--spacing-x-2 .md-button { margin: 0.25rem; }
@media (prefers-reduced-motion: reduce) {
  .md-card { transition: none !important; }
  .choice-btn { pointer-events: auto; }
}
#dungeon-log { font-size: 0.75rem; color: var(--md-sys-on-surface, #fff); opacity: 0.7; }
</style>
{% endblock %}

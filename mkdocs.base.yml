site_name: Aldo-f docs
site_description: >-
  Documentation hub for Aldo Fieuw's home lab and projects:
  Clocky, Thuis, Radio Community and the infrastructure that runs them.
repo_url: https://github.com/Aldo-f/Aldo-f.github.io
repo_name: Aldo-f/Aldo-f.github.io
theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
    - scheme: slate
      primary: indigo
      accent: indigo
  features:
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.share
    - search.suggest
    - navigation.indexes
    - navigation.sections
    - toc.follow
    - content.image.zoom
plugins:
  - autotranslate:
      languages: [en, nl]
      paths: [blog/posts, about.md, projects.md, index.md]
      exclude: [blog/category/*]
      mode: report
  - blog:
      blog_dir: blog
      post_date_format: yyyy-MM-dd
      archive: true
  - search
  - mermaid2:
      version: "10.4.0"
  - section-index
extra:
  mermaid_version: "10.4.0"
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Aldo-f
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/aldo-fieuw
    - icon: fontawesome/brands/mastodon
      link: https://mastodon.social/@AldoF
markdown_extensions:
  - tables
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
hooks:
  - hooks/slugmap.py
  - hooks/lightbox.py
  - hooks/related_posts.py
  - hooks/dynamic_repo.py
  - hooks/chat.py
  - hooks/socialmedia.py

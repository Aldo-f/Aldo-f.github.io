<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The 404 Dungeon</title>
<style>
  :root {
    --dungeon-bg: #1a1a1f;
    --dungeon-card: #2a2a35;
    --dungeon-card-hover: #353542;
    --dungeon-text: #e8e8e8;
    --dungeon-text-dim: #888899;
    --dungeon-accent: #ff6b35;
    --dungeon-accent-glow: rgba(255, 107, 53, 0.3);
    --dungeon-hp: #e74c3c;
    --dungeon-confusion: #9b59b6;
    --dungeon-slime: #2ecc71;
    --dungeon-border: #444455;
    --dungeon-radius: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--dungeon-bg);
    color: var(--dungeon-text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    background-image:
      radial-gradient(circle at 20% 50%, rgba(255,107,53,0.05) 0%, transparent 50%),
      radial-gradient(circle at 80% 20%, rgba(155,89,182,0.05) 0%, transparent 50%);
  }

  .dungeon-container {
    width: 100%;
    max-width: 560px;
  }

  .dungeon-card {
    background: var(--dungeon-card);
    border: 1px solid var(--dungeon-border);
    border-radius: var(--dungeon-radius);
    padding: 1.5rem;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    transition: opacity 250ms cubic-bezier(0.4, 0, 0.2, 1), transform 250ms cubic-bezier(0.4, 0, 0.2, 1);
  }

  .dungeon-card.fade-out {
    opacity: 0;
    transform: translateY(-8px);
  }

  .dungeon-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--dungeon-border);
  }

  .dungeon-title {
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .dungeon-stats {
    display: flex;
    gap: 0.75rem;
    align-items: center;
  }

  .stat-group {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.875rem;
  }

  .hearts {
    display: flex;
    gap: 0.15rem;
  }

  .heart {
    color: var(--dungeon-hp);
    font-size: 1.1rem;
    transition: transform 200ms, opacity 200ms;
  }

  .heart.lost {
    opacity: 0.2;
    transform: scale(0.8);
  }

  .confusion-meter {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    color: var(--dungeon-confusion);
  }

  .confusion-bar {
    width: 60px;
    height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 3px;
    overflow: hidden;
  }

  .confusion-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--dungeon-slime), var(--dungeon-confusion));
    border-radius: 3px;
    transition: width 300ms cubic-bezier(0.4, 0, 0.2, 1);
  }

  .dungeon-narrative {
    font-size: 1rem;
    line-height: 1.6;
    color: var(--dungeon-text);
    margin-bottom: 1.5rem;
    min-height: 4.5rem;
    padding: 1rem;
    background: rgba(0,0,0,0.2);
    border-radius: 12px;
    border-left: 3px solid var(--dungeon-accent);
  }

  .choices {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
  }

  .choice-btn {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    width: 100%;
    padding: 1rem 1.25rem;
    background: var(--dungeon-card-hover);
    border: 1px solid var(--dungeon-border);
    border-radius: 12px;
    color: var(--dungeon-text);
    font-size: 0.95rem;
    font-family: inherit;
    cursor: pointer;
    transition: all 200ms cubic-bezier(0.4, 0, 0.2, 1);
    text-align: left;
  }

  .choice-btn:hover {
    background: var(--dungeon-accent);
    border-color: var(--dungeon-accent);
    transform: translateX(4px);
    box-shadow: 0 4px 16px var(--dungeon-accent-glow);
  }

  .choice-btn:active {
    transform: translateX(2px) scale(0.99);
  }

  .choice-icon {
    font-size: 1.2rem;
    flex-shrink: 0;
    width: 28px;
    text-align: center;
  }

  .choice-label {
    flex: 1;
  }

  .dungeon-log {
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 0.8rem;
    color: var(--dungeon-text-dim);
    padding: 0.75rem 1rem;
    background: rgba(0,0,0,0.3);
    border-radius: 8px;
    min-height: 2.5rem;
    margin-bottom: 1rem;
    border: 1px solid var(--dungeon-border);
  }

  .escape-section {
    text-align: center;
  }

  .escape-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.85rem 2rem;
    background: var(--dungeon-slime);
    border: none;
    border-radius: 12px;
    color: #000;
    font-size: 1rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 200ms cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 4px 16px rgba(46, 204, 113, 0.3);
  }

  .escape-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 24px rgba(46, 204, 113, 0.4);
  }

  .escape-btn:active {
    transform: translateY(0);
  }

  .escape-btn.hidden {
    display: none;
  }

  @media (prefers-reduced-motion: reduce) {
    .dungeon-card, .choice-btn, .escape-btn, .confusion-fill, .heart {
      transition: none !important;
    }
    .choice-btn:hover {
      transform: none;
    }
  }

  @media (max-width: 480px) {
    .dungeon-card {
      padding: 1rem;
    }
    .dungeon-header {
      flex-direction: column;
      gap: 0.75rem;
      align-items: flex-start;
    }
    .dungeon-stats {
      width: 100%;
      justify-content: space-between;
    }
    .choice-btn {
      padding: 0.85rem 1rem;
    }
  }
</style>
</head>
<body>
  <div class="dungeon-container" id="dungeon-scene">
    <div class="dungeon-card" id="dungeon-card">
      <div class="dungeon-header">
        <div class="dungeon-title" id="dungeon-title-text">⚔ The 404 Dungeon</div>
        <div class="dungeon-stats">
          <div class="stat-group">
            <span>♥</span>
            <div class="hearts" id="dungeon-hearts">
              <span class="heart">♥</span>
              <span class="heart">♥</span>
              <span class="heart">♥</span>
            </div>
            <span id="dungeon-hp" style="display:none">3</span>
          </div>
          </div>
          <div class="stat-group">
            <span>🧠</span>
            <div class="confusion-meter">
              <span id="dungeon-conf">0</span>/3
              <div class="confusion-bar">
                <div class="confusion-fill" id="dungeon-conf-fill" style="width: 0%"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="dungeon-narrative" id="dungeon-text">
        Loading dungeon data...
      </div>

      <div class="choices" id="dungeon-choices">
        <!-- Choice buttons injected here -->
      </div>

      <div class="dungeon-log" id="dungeon-log">
        [Awaiting your decision...]
      </div>

      <div class="escape-section">
        <button class="escape-btn hidden" id="escape-btn">Terug naar start</button>
          <span>🚪</span> Back to Homepage
        </button>
      </div>
    </div>
  </div>

<script>
const MAX_CONF = 3;
const BASE = window.location.pathname.includes('/nl/') ? '/nl' : '';
const DATA_URL = `${BASE}/assets/data/404_dungeon.json`;

console.log(`[404 Dungeon] loading data from ${DATA_URL}`);

let state = { node: 'start', confusion: 0 };
let scenes = {};

async function init() {
  try {
    const response = await fetch(DATA_URL);
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }
    scenes = await response.json();
    console.log(`[404 Dungeon] loaded ${Object.keys(scenes.nodes).length} scenes`);
    render();
  } catch (err) {
    console.error(`[404 Dungeon] failed to load data: ${err.message}`);
    document.getElementById('dungeon-text').textContent =
      `Error loading dungeon data: ${err.message}. Please try again later.`;
  }
}

function t(node, field) {
  const v = scenes.nodes[node]?.[field];
  if (typeof v === 'object') return v[LANG] || v['en'] || '';
  return v || '';
}

const LANG = window.location.pathname.includes('/nl/') ? 'nl' : 'en';

function log(msg) {
  console.log(`[404 Dungeon] ${msg}`);
  const el = document.getElementById('dungeon-log');
  if (el) el.textContent = msg;
}

function fadeOutThen(fn) {
  const card = document.getElementById('dungeon-card');
  card.classList.add('fade-out');
  setTimeout(() => {
    card.classList.remove('fade-out');
    fn();
  }, 250);
}

function render() {
  const s = scenes.nodes[state.node];
  if (!s) return;

  const title = state.node === 'start' ? 'The 404 Dungeon' : t(state.node, 'label') || state.node;

  // Fade transition
  fadeOutThen(() => {
    document.getElementById('dungeon-text').textContent = t(state.node, 'text');

    // Update HP hearts
    const hp = Math.max(0, MAX_CONF - state.confusion);
    document.getElementById('dungeon-hp').textContent = hp;
    const hearts = document.querySelectorAll('#dungeon-hearts .heart');
    hearts.forEach((heart, i) => {
      if (i < hp) {
        heart.classList.remove('lost');
      } else {
        heart.classList.add('lost');
      }
    });

    // Update confusion
    const conf = Math.min(MAX_CONF, state.confusion);
    document.getElementById('dungeon-conf').textContent = conf;
    document.getElementById('dungeon-conf-fill').style.width = `${(conf / MAX_CONF) * 100}%`;

    // Show/hide escape button
    const escapeBtn = document.getElementById('escape-btn');
    escapeBtn.classList.toggle('hidden', (s.choices?.length || 0) !== 0);

    log(`[${state.node}] confusion=${state.confusion}`);

    // Render choices
    const grid = document.getElementById('dungeon-choices');
    grid.innerHTML = '';

    (s.choices || []).forEach((c, i) => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';

      // Assign icons based on choice context
      const icons = ['🔍', '🌑', '⚔️', '🚪', '💡', '🗺️'];
      const icon = icons[i % icons.length];

      btn.innerHTML = `
        <span class="choice-icon">${icon}</span>
        <span class="choice-label">${t(c, 'label')}</span>
      `;

      btn.addEventListener('click', () => {
        console.log(`[404 Dungeon] choice: ${t(c, 'label')} -> ${c.next || 'escape'}`);
        state.node = c.next || 'escape';
        const dest = scenes.nodes[state.node];
        if (dest && dest.statDelta !== undefined) {
          state.confusion = Math.max(0, Math.min(MAX_CONF, state.confusion + dest.statDelta));
        }
        log(`chose "${t(c, 'label')}" -> ${state.node} (confusion=${state.confusion})`);
        render();
      });

      grid.appendChild(btn);
    });

    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
    }
  });
}

document.getElementById('escape-btn').addEventListener('click', () => {
  console.log('[404 Dungeon] escaping to homepage');
  window.location.href = BASE || '/';
});

init();
</script>
</body>
</html>
